name: Docker

# Builds the image on pull requests without pushing it, so a change that
# breaks the Dockerfile fails here rather than on main.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        # One platform: the Dockerfile is the same for both, and QEMU would
        # make every pull request several minutes slower.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
