<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>SQL MCP</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before first paint, so a dark page never
      // flashes white while the app boots.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (!dark) return
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090b')
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black')
      })()
    </script>
  </head>
  <body class="bg-white md:bg-zinc-100 dark:bg-zinc-950 text-slate-900 font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
